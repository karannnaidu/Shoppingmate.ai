name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shoppingmate
          POSTGRES_PASSWORD: shoppingmate_dev
          POSTGRES_DB: shoppingmate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shoppingmate -d shoppingmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgres://shoppingmate:shoppingmate_dev@127.0.0.1:5432/shoppingmate
      REDIS_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: auto
      S3_ACCESS_KEY_ID: shoppingmate
      S3_SECRET_ACCESS_KEY: shoppingmate_dev
      S3_BUCKET: shoppingmate-dev
      API_PORT: 3000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.6.2 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
